<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar | SkyLux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="theme-toggle" hidden>
  <div class="theme-root">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html" style="text-decoration: none;">SKYLUX</a>
      <nav class="main-nav">
        <a href="/Frota/frota.html">Frota</a>
        <a href="/Destinos/destinos.html">Destinos</a>
        <a href="/Reservar/reservar.html" class="active">Reservar</a>
      </nav>
      <div class="header-actions">
        <label for="theme-toggle" class="button button-tertiary" aria-label="Alternar modo escuro"></label>
        <a class="button button-tertiary" href="/Home/login.html">Entrar</a>
        <a class="button button-primary" href="/Reservar/reservar.html">Reservar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section section-step">
      <div class="container step-indicator">
        <span class="step-item active">01 Rota</span>
        <span class="step-separator">—</span>
        <span class="step-item">02 Aeronave</span>
        <span class="step-separator">—</span>
        <span class="step-item">03 Confirmação</span>
      </div>

      <div class="container page-title">
        <h1>Para onde vamos?</h1>
      </div>

      <div class="container route-panel">
        <div class="route-grid">
          <div class="route-row">
            <label class="field-label">Origem</label>
            <input type="text" value="São Paulo, VCP">
          </div>
          <div class="route-row">
            <label class="field-label">Destino</label>
            <input type="text" value="Londres, FAB">
          </div>
          <div class="route-row route-row-split">
            <div>
              <label class="field-label">Data de ida</label>
              <input type="date" value="dd/mm/aaaa">
            </div>
            <div>
              <label class="field-label">Passageiros</label>
              <input type="number" value="16">
            </div>
          </div>
        </div>
        <a class="button button-primary route-button" href="/Reservar/Aeronave/Aeronave.html">Ver aeronaves disponíveis</a>
      </div>
    </section>
  </main>
  </div>
</body>
</html>
