<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | SkyLux</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Home/index.html">SKYLUX</a>
      <nav class="main-nav">
        <a href="/Frota/frota.html">Frota</a>
        <a href="/Destinos/destinos.html">Destinos</a>
        <a href="/Reservar/reservar.html">Reservar</a>
      </nav>
      <div class="header-actions">
        <a class="button button-tertiary" href="/Home/login.html">Entrar</a>
        <a class="button button-primary" href="/Reservar/reservar.html">Reservar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="register-section">
      <div class="container register-grid">
        <div class="register-copy">
          <span class="label">Acesso de membros</span>
          <h1>Crie sua conta.</h1>
          <p>Abra um perfil SkyLux para gerenciar reservas, solicitar atendimento dedicado e receber ofertas exclusivas.</p>
        </div>

        <div class="register-panel">
          <form class="register-form">
            <label class="field-label" for="fullname">Nome completo</label>
            <input class="form-input" type="text" id="fullname" name="fullname" placeholder="Seu nome completo" required>

            <label class="field-label" for="email">E-mail</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="seu@exemplo.com" required>

            <label class="field-label" for="password">Senha</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required>

            <button class="button button-primary register-button" type="submit">Criar conta</button>

            <div class="login-divider">
              <span>ou</span>
            </div>

            <button class="button button-secondary register-google" type="button">Continuar com Google</button>

            <p class="register-footer">Já é membro? <a href="/Login/login.html">Entrar</a></p>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
